# Nginx — reverse proxy pour livrespdfgratuits.com
# À copier dans /etc/nginx/sites-available/livrespdfgratuits puis :
#   sudo ln -s /etc/nginx/sites-available/livrespdfgratuits /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE : ce bloc est en HTTP (port 80). Après avoir lancé certbot
# (voir README), celui-ci ajoute automatiquement le bloc HTTPS 443
# et la redirection HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name livrespdfgratuits.com www.livrespdfgratuits.com;

    # IMPORTANT : autorise l'upload de gros PDF (MAX_FILE_SIZE = 50 Mo).
    # Sans ça, Nginx bloque à 1 Mo par défaut (erreur 413).
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
